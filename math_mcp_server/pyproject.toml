[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-mcp-server"
version = "1.0.0"
description = "Math MCP Server for Algebra-based Physics"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
keywords = ["mcp", "math", "physics", "algebra", "trigonometry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastmcp>=0.1.0",
    "mcp>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black",
    "flake8",
    "mypy",
]

[project.scripts]
math-mcp-server = "math_mcp_server:main"

[project.urls]
Homepage = "https://github.com/yourusername/math-mcp-server"
Documentation = "https://github.com/yourusername/math-mcp-server#readme"
Repository = "https://github.com/yourusername/math-mcp-server.git"
Issues = "https://github.com/yourusername/math-mcp-server/issues"

[tool.setuptools]
py-modules = ["math_mcp_server"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
